# Isolated frontend/AI verification stack. Does not reuse the existing development volume.
# docker compose -f docker-compose.verify.yml up -d --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    ports: ["127.0.0.1:15433:5432"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: local-verification-only
      POSTGRES_DB: youthletter_verify
      TZ: Asia/Seoul
    volumes:
      - verify_db:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/02-apply-migrations.sh:/docker-entrypoint-initdb.d/02-apply-migrations.sh:ro
      - ./docker/postgres/03-sample-data.sql:/docker-entrypoint-initdb.d/03-sample-data.sql:ro
      - ./docker/postgres/upgrade-capstone.sql:/migrations/upgrade-capstone.sql:ro
      - ./src/main/resources/db/migration:/migrations/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d youthletter_verify"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports: ["18080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/youthletter_verify
      DB_USERNAME: test
      DB_PASSWORD: local-verification-only
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_DATA_REDIS_HOST: redis
      AI_SERVICE_BASE_URL: http://host.docker.internal:3002
      AI_USE_STUB: "false"
      AI_JOBS_ENABLED: "false"
      CRAWLER_CRON: "-"
      POLICY_NOTIFICATION_CRON: "-"
      PUSH_ENABLED: "false"
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  verify_db:
