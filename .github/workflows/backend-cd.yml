# ============================================
# 유스레터 Backend CD
# main 브랜치 머지 시 Docker 이미지 빌드 + 배포
# ============================================

name: Backend CD

on:
  push:
    branches: [ main ]
    paths:
      - '**.java'
      - '**.gradle'
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build JAR
        run: ./gradlew bootJar --no-daemon -x test

      # Docker 이미지 빌드
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t youthletter-backend:${{ github.sha }} .
          docker tag youthletter-backend:${{ github.sha }} youthletter-backend:latest

      # ── 배포 (서버에 SSH 접속하여 docker-compose 재시작) ──
      # 졸업작품 규모에서는 단일 서버 + Docker Compose가 현실적
      - name: Deploy to server
        if: false  # TODO: 서버 준비 후 true로 변경
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/youthletter-backend
            git pull origin main
            docker-compose -f docker-compose.prod.yml build backend
            docker-compose -f docker-compose.prod.yml up -d backend
            docker image prune -f
