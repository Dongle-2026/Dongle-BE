# ============================================
# 유스레터 - 로컬 테스트용 Docker Compose
# CI의 GitHub Actions 서비스와 동일한 환경
# 사용법: docker-compose -f docker-compose.test.yml up -d
# 테스트 후: docker-compose -f docker-compose.test.yml down
# ============================================

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: youthletter-postgres-test
    environment:
      POSTGRES_DB: youthletter_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test1234
      TZ: Asia/Seoul
    ports:
      - "5433:5432"  # 개발용 5432와 충돌 방지
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./docker/postgres/upgrade-capstone.sql:/docker-entrypoint-initdb.d/02-capstone.sql
      - ./src/main/resources/db/migration/V16__ai_jobs.sql:/docker-entrypoint-initdb.d/03-ai-jobs.sql
      - ./src/main/resources/db/migration/V17__spending_record_sequence.sql:/docker-entrypoint-initdb.d/04-spending-sequence.sql
      - ./src/main/resources/db/migration/V18__notification_read_state.sql:/docker-entrypoint-initdb.d/05-notification-read.sql
      - ./src/main/resources/db/migration/V19__term_bookmarks.sql:/docker-entrypoint-initdb.d/06-term-bookmarks.sql
      - ./src/main/resources/db/migration/V20__notification_settings.sql:/docker-entrypoint-initdb.d/07-notification-settings.sql
      - ./src/main/resources/db/migration/V21__profile_image.sql:/docker-entrypoint-initdb.d/08-profile-image.sql
      - ./src/main/resources/db/migration/V22__search_logs.sql:/docker-entrypoint-initdb.d/09-search-logs.sql
      - ./src/main/resources/db/migration/V23__quiz_honey.sql:/docker-entrypoint-initdb.d/10-quiz-honey.sql
      - ./src/main/resources/db/migration/V24__article_thumbnail.sql:/docker-entrypoint-initdb.d/11-article-thumbnail.sql
      - ./src/main/resources/db/migration/V25__quiz_reveals.sql:/docker-entrypoint-initdb.d/12-quiz-reveals.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d youthletter_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: youthletter-redis-test
    ports:
      - "6380:6379"  # 개발용 6379와 충돌 방지
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
