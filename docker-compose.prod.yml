# ============================================
# 유스레터 - 프로덕션 Docker Compose
# 사용법: docker-compose -f docker-compose.prod.yml up -d
# DB + Redis + Spring Boot. --profile ai 로 저장소의 AI 서비스 추가 (프론트 별도)
# ============================================

services:
  # ── 인프라 ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: youthletter-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./docker/postgres/02-apply-migrations.sh:/docker-entrypoint-initdb.d/02-apply-migrations.sh:ro
      - ./docker/postgres/upgrade-capstone.sql:/migrations/upgrade-capstone.sql:ro
      - ./src/main/resources/db/migration:/migrations/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - youthletter-net

  redis:
    image: redis:7-alpine
    container_name: youthletter-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - youthletter-net

  # ── Spring Boot (Main API) ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youthletter-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-service:3000}
      AI_USE_STUB: ${AI_USE_STUB:-false}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_MODEL_VERSION: ${OLLAMA_CHAT_MODEL:-gemma3:4b}
      AI_JOBS_ENABLED: ${AI_JOBS_ENABLED:-true}
      # 기사당 AI 호출 1회로 요약·용어 5개 이상·카드뉴스·퀴즈를 한 번에 저장한다(docs/FAST_PIPELINE.md)
      AI_SERVICE_BUNDLE_MODE: ${AI_SERVICE_BUNDLE_MODE:-true}
      CRAWLER_SECTIONS: ${CRAWLER_SECTIONS:-economy,koreamarket/,realestate}
      CRAWLER_MAEKYUNG_ENABLED: ${CRAWLER_MAEKYUNG_ENABLED:-true}
      CRAWLER_MAEKYUNG_MAX_PER_SECTION: ${CRAWLER_MAEKYUNG_MAX_PER_SECTION:-10}
      CRAWLER_MAEKYUNG_INTERVAL_MS: ${CRAWLER_MAEKYUNG_INTERVAL_MS:-1800000}
      CRAWLER_HANKYUNG_INTERVAL_MS: ${CRAWLER_HANKYUNG_INTERVAL_MS:-3600000}
      GOOGLE_MOBILE_CLIENT_IDS: ${GOOGLE_MOBILE_CLIENT_IDS:-}
      KAKAO_APP_KEYS: ${KAKAO_APP_KEYS:-}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:-https://youthletter.com/auth/callback}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      # 수집은 콘텐츠 파이프라인(수집 → 요약·용어·카드뉴스·퀴즈 대기열)이 맡는다. 예전 크론 수집기는 카드·퀴즈를 만들지 않아 끈다.
      CONTENT_PIPELINE_ENABLED: ${CONTENT_PIPELINE_ENABLED:-true}
      CONTENT_PIPELINE_INTERVAL_MS: ${CONTENT_PIPELINE_INTERVAL_MS:-1800000}
      CRAWLER_CRON: ${CRAWLER_CRON:--}
      POLICY_NOTIFICATION_CRON: ${POLICY_NOTIFICATION_CRON:-0 0 9 * * *}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      # 외부 접속은 같은 서버의 Caddy(443)가 받아 넘긴다. 8080은 서버 자신에게만 연다.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - youthletter-net

  # Optional AI process; the Ollama model server is configured separately.
  ai-service:
    profiles: [ai]
    build: ./ai-service
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-gemma3:4b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-300000}
      MIN_ARTICLE_TERMS: ${MIN_ARTICLE_TERMS:-5}
      SUMMARY_MODE: ${SUMMARY_MODE:-extractive}
      CARD_GENERATION_MODE: ${CARD_GENERATION_MODE:-ranked}
      QUIZ_GENERATION_MODE: ${QUIZ_GENERATION_MODE:-mixed}
      AI_REQUEST_BUDGET_MS: ${AI_REQUEST_BUDGET_MS:-500000}  # 재시도 포함 요청 1건 마감. 백엔드 AI_TIMEOUT_SECONDS(540)보다 짧게
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - youthletter-net

volumes:
  postgres_data:
    name: youthletter_postgres_data_prod
  redis_data:
    name: youthletter_redis_data_prod

networks:
  youthletter-net:
    driver: bridge
