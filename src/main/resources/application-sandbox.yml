# Local manual testing against the isolated quick-test database. Use local,sandbox.
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:15434/youthletter_test
    username: test
    password: test1234
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: 127.0.0.1
      port: 16381
server:
  port: 18081
ai-service:
  use-stub: ${AI_USE_STUB:true}
ai-jobs:
  enabled: ${AI_JOBS_ENABLED:false}
crawler:
  cron: '-'
policy:
  notification-cron: '-'
push:
  enabled: false
logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
