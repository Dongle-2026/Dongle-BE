spring:
  application:
    name: youthletter-backend

  profiles:
    active: local  # 기본 프로필 (IntelliJ 실행 시)

  # ── 업로드 (프로필 사진: 서버에서 512px JPEG로 축소 후 DB 저장) ──
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ── JPA 공통 설정 ──
  jpa:
    open-in-view: false  # OSIV 비활성화 (성능 + 명시적 트랜잭션 관리)
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100  # N+1 방지 기본 배치 사이즈

  # ── 스케줄링 ──
  task:
    scheduling:
      pool:
        size: 3

  data:
    web:
      pageable:
        max-page-size: 100

  # ── Jackson 직렬화 ──
  jackson:
    serialization:
      write-dates-as-timestamps: false  # ISO-8601 형식
    default-property-inclusion: non_null

ai-service:
  base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:3000}
  bundle-mode: ${AI_SERVICE_BUNDLE_MODE:false}
  use-stub: ${AI_USE_STUB:false}
  model-version: ${AI_MODEL_VERSION:qwen3:8b}
  token: ${AI_SERVICE_TOKEN:}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:540}  # 퀴즈는 생성+자기검증 최대 4회 호출. 작업 리스(10분)보다 짧게

# ── 모바일 소셜 로그인 (앱이 보낸 idToken 검증) ──
# audiences가 비어 있는 제공자는 503(설정 안 됨)으로 거부한다.
mobile-oauth:
  providers:
    google:
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      issuers: https://accounts.google.com,accounts.google.com
      audiences: ${GOOGLE_MOBILE_CLIENT_IDS:}   # iOS/Android/웹 OAuth 클라이언트 ID, 쉼표 구분
    kakao:
      jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
      issuers: https://kauth.kakao.com
      audiences: ${KAKAO_APP_KEYS:}             # 카카오 앱 키(네이티브 앱 키 등), 쉼표 구분. OIDC 활성화 필요

# ── 푸시 알림 (Expo Push API) ──
# 기본은 꺼짐. 켜면 정기 알림(한국 시간)과 정책 마감 알림을 앱 기기(ExponentPushToken)로 보낸다.
push:
  enabled: ${PUSH_ENABLED:false}
  expo-access-token: ${EXPO_ACCESS_TOKEN:}       # Expo 계정에서 Push security를 켠 경우만 필요
  daily-digest-cron: ${PUSH_DAILY_DIGEST_CRON:0 0 8 * * *}
  quiz-reminder-cron: ${PUSH_QUIZ_REMINDER_CRON:0 0 19 * * *}
  streak-alert-cron: ${PUSH_STREAK_ALERT_CRON:0 0 21 * * *}

# ── Swagger ──
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
    version: openapi_3_0
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# ── 서버 설정 ──
server:
  port: 8080
  servlet:
    context-path: /

---
# ============================================
# LOCAL 프로필 (IntelliJ에서 개발 시)
# ============================================
spring:
  config:
    activate:
      on-profile: local

  # ── PostgreSQL ──
  datasource:
    url: jdbc:postgresql://localhost:15432/youthletter
    username: ${DB_USERNAME:youthletter}
    password: ${DB_PASSWORD:youthletter1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000

  # ── JPA (local) ──
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # ── Redis ──
  data:
    redis:
      host: localhost
      port: 6379

  # ── OAuth2 (카카오, 구글) ──
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:your-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:your-kakao-client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# ── JWT ──
jwt:
  secret: ${JWT_SECRET:youth-letter-local-dev-secret-key-at-least-256-bits-long-for-hs256}
  access-token-expiration: 900000      # 15분 (ms)
  refresh-token-expiration: 604800000  # 7일 (ms)

# ── OAuth2 프론트엔드 리다이렉트 ──
# FE(Next.js) 실행 중: OAUTH2_REDIRECT_URI=http://localhost:3001/auth/callback
# FE 없이 백엔드만 테스트: 기본값 localhost:8080/auth/callback.html 사용
oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:8080/auth/callback.html}

# ── AI Service (Node.js) 내부 호출 ──
ai-service:
  base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:3000}

# ── 로깅 ──
logging:
  level:
    com.youthletter: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE  # 바인드 파라미터 출력

---
# ============================================
# PROD 프로필
# ============================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:youthletter}
    username: ${DB_USERNAME:youthletter}
    password: ${DB_PASSWORD:youthletter1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:https://youthletter.com/auth/callback}

ai-service:
  base-url: ${AI_SERVICE_BASE_URL:http://ai-service:3000}

logging:
  level:
    com.youthletter: INFO
    org.hibernate.SQL: WARN

# 매일경제 RSS 수집(기본 끔). 파이프라인·운영 Compose에서 켠다.
crawler:
  maekyung:
    enabled: ${CRAWLER_MAEKYUNG_ENABLED:false}
    max-per-section: ${CRAWLER_MAEKYUNG_MAX_PER_SECTION:10}
