<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 처리 중...</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
    .box { text-align: center; color: #555; }
    .spinner { width: 36px; height: 36px; border: 4px solid #ddd; border-top-color: #4361ee; border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="msg">로그인 처리 중...</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const accessToken  = params.get('accessToken');
    const refreshToken = params.get('refreshToken');
    const error        = params.get('error');

    if (error) {
      document.getElementById('msg').textContent = '로그인 실패: ' + error;
    } else if (accessToken && refreshToken) {
      localStorage.setItem('accessToken', accessToken);
      localStorage.setItem('refreshToken', refreshToken);
      window.location.replace('/test.html');
    } else {
      document.getElementById('msg').textContent = '토큰을 받지 못했습니다.';
    }
  </script>
</body>
</html>
