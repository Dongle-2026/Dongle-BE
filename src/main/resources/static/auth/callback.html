<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 처리 중...</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
    .box { text-align: center; color: #555; }
    .spinner { width: 36px; height: 36px; border: 4px solid #ddd; border-top-color: #4361ee; border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="msg">로그인 처리 중...</p>
  </div>
  <script>
    const FRONTEND_ORIGIN = 'http://localhost:3000';
    const FRONTEND_CALLBACK = FRONTEND_ORIGIN + '/auth/callback';

    const params = new URLSearchParams(window.location.search);
    const accessToken  = params.get('accessToken');
    const refreshToken = params.get('refreshToken');
    const error        = params.get('error');

    if (error) {
      // message: 같은 이메일로 이미 가입된 경우의 안내 등(서버가 보냄). 없으면 오류 코드 표시
      document.getElementById('msg').textContent = '로그인 실패: ' + (params.get('message') || error);

    } else if (accessToken && refreshToken) {
      // 1. 백엔드 localStorage에 저장 → 기능 확인 페이지(index.html)에서 바로 사용 가능
      localStorage.setItem('accessToken', accessToken);
      localStorage.setItem('refreshToken', refreshToken);

      // 2. 프론트엔드(localhost:3000)가 실행 중이면 거기에도 토큰 전달
      //    no-cors 모드: 응답 내용은 못 읽지만 서버가 살아있으면 resolve
      fetch(FRONTEND_ORIGIN + '/favicon.ico', {
        mode: 'no-cors',
        signal: AbortSignal.timeout(800)
      })
      .then(() => {
        // 프론트엔드 실행 중 → 프론트엔드 콜백으로 포워딩 (프론트도 로그인 처리)
        const dest = FRONTEND_CALLBACK
          + '?accessToken=' + encodeURIComponent(accessToken)
          + '&refreshToken=' + encodeURIComponent(refreshToken);
        window.location.replace(dest);
      })
      .catch(() => {
        // 프론트엔드 미실행 → 백엔드 기능 확인 페이지로 이동
        window.location.replace('/index.html#account');
      });

    } else {
      document.getElementById('msg').textContent = '토큰을 받지 못했습니다.';
    }
  </script>
</body>
</html>
