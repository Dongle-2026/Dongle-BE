<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — 유스레터</title>
  <style>
    :root {
      --yellow: #FFD600;
      --yellow-dark: #F0C800;
      --black: #111111;
      --dark: #1a1a2e;
      --gray: #f5f5f5;
      --gray2: #e8e8e8;
      --sub: #888;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--dark);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── 배경 꾸밈 ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(255,214,0,.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(255,214,0,.06) 0%, transparent 50%);
      pointer-events: none;
    }

    /* ── 카드 ── */
    .login-card {
      width: 100%; max-width: 400px;
      margin: 20px;
      position: relative;
    }

    /* ── 로고 영역 ── */
    .logo-area {
      text-align: center;
      margin-bottom: 48px;
    }
    .logo-icon {
      width: 64px; height: 64px;
      background: var(--yellow);
      border-radius: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(255,214,0,.3);
    }
    .logo-title {
      font-size: 28px; font-weight: 900;
      color: #fff; letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .logo-subtitle {
      font-size: 14px; color: rgba(255,255,255,.5);
      line-height: 1.6;
    }

    /* ── 소셜 버튼 ── */
    .social-btn {
      width: 100%; padding: 16px 20px;
      border-radius: 14px; border: none;
      font-size: 15px; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      transition: transform .15s, box-shadow .15s;
      margin-bottom: 12px;
      text-decoration: none;
    }
    .social-btn:hover { transform: translateY(-2px); }
    .social-btn:active { transform: translateY(0); }

    .btn-kakao {
      background: #FEE500; color: #191919;
      box-shadow: 0 4px 20px rgba(254,229,0,.25);
    }
    .btn-kakao:hover { box-shadow: 0 8px 32px rgba(254,229,0,.4); }

    .btn-google {
      background: #fff; color: #3c4043;
      box-shadow: 0 4px 20px rgba(0,0,0,.2);
    }
    .btn-google:hover { box-shadow: 0 8px 32px rgba(0,0,0,.3); }

    .btn-icon { width: 22px; height: 22px; flex-shrink: 0; }

    /* ── 구분선 ── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 28px 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: rgba(255,255,255,.1);
    }
    .divider span { font-size: 12px; color: rgba(255,255,255,.3); white-space: nowrap; }

    /* ── 하단 링크 ── */
    .footer-links {
      text-align: center;
      margin-top: 32px;
    }
    .footer-links a {
      font-size: 13px; color: rgba(255,255,255,.4);
      text-decoration: none; transition: color .15s;
    }
    .footer-links a:hover { color: rgba(255,255,255,.8); }

    /* ── 로딩 상태 ── */
    .loading-overlay {
      position: fixed; inset: 0;
      background: var(--dark);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100;
      display: none;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,214,0,.2);
      border-top-color: var(--yellow);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: rgba(255,255,255,.6); font-size: 14px; }

    /* ── 토스트 ── */
    #toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: #fff; color: var(--black);
      padding: 12px 24px; border-radius: 24px;
      font-size: 14px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity .25s;
      z-index: 999; white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- 로딩 오버레이 (OAuth 콜백 처리 중) -->
<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">로그인 처리 중...</div>
</div>

<!-- 로그인 카드 -->
<div class="login-card" id="login-card">

  <!-- 로고 -->
  <div class="logo-area">
    <div class="logo-icon">🐝</div>
    <div class="logo-title">유스레터</div>
    <div class="logo-subtitle">청년을 위한 금융 AI 플랫폼<br>소셜 계정으로 간편하게 시작하세요</div>
  </div>

  <!-- 카카오 로그인 -->
  <a class="social-btn btn-kakao" href="/oauth2/authorization/kakao">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none">
      <path d="M12 3C7.03 3 3 6.36 3 10.5c0 2.67 1.64 5.02 4.12 6.4l-.74 2.73a.3.3 0 0 0 .44.33L10.2 18c.59.08 1.19.13 1.8.13 4.97 0 9-3.36 9-7.5S16.97 3 12 3z" fill="#191919"/>
    </svg>
    카카오로 시작하기
  </a>

  <!-- 구글 로그인 -->
  <a class="social-btn btn-google" href="/oauth2/authorization/google">
    <svg class="btn-icon" viewBox="0 0 24 24">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    구글로 시작하기
  </a>

  <div class="divider"><span>소셜 계정으로만 가입 가능해요</span></div>

  <div class="footer-links">
    <a href="home.html">로그인 없이 둘러보기 →</a>
  </div>

</div>

<div id="toast"></div>

<script>
  // ── OAuth2 콜백 처리 ──
  (function handleCallback() {
    const params = new URLSearchParams(window.location.search);
    const accessToken  = params.get('accessToken');
    const refreshToken = params.get('refreshToken');
    const error        = params.get('error');

    // 에러 처리
    if (error) {
      window.history.replaceState({}, '', '/login.html');
      setTimeout(() => showToast('로그인에 실패했어요. 다시 시도해주세요.'), 100);
      return;
    }

    // 로그인 성공 — 토큰 저장 후 홈으로
    if (accessToken) {
      document.getElementById('loading-overlay').classList.add('show');
      document.getElementById('login-card').style.display = 'none';

      localStorage.setItem('accessToken', accessToken);
      if (refreshToken) localStorage.setItem('refreshToken', refreshToken);

      window.history.replaceState({}, '', '/login.html');
      setTimeout(() => { location.href = 'home.html'; }, 500);
      return;
    }

    // 이미 로그인된 경우 홈으로
    if (localStorage.getItem('accessToken')) {
      location.href = 'home.html';
    }
  })();

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
