# ============================================
# 테스트 프로필 (CI + 로컬 테스트)
# ============================================
ai-jobs:
  enabled: false

spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:youthletter_test}
    username: ${DB_USERNAME:test}
    password: ${DB_PASSWORD:test1234}
    driver-class-name: org.postgresql.Driver
    # 테스트 클래스마다 설정이 달라 Spring 컨텍스트가 여러 개 캐시된다.
    # 컨텍스트당 기본 10개 연결이면 테스트 DB 한도(100)를 넘어 'too many clients'가 난다.
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-id
            client-secret: test-kakao-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email
          google:
            client-id: test-google-id
            client-secret: test-google-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET:test-secret-key-at-least-256-bits-long-for-hs256-algorithm-testing}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

ai-service:
  base-url: http://localhost:3000

logging:
  level:
    com.youthletter: DEBUG
    org.hibernate.SQL: DEBUG
